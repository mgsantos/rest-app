stages:
  - build
  - deploy

variables:
  ECR_REPO: "$ECR_REPO" # From your Terraform output
  ECS_CLUSTER: "$ECS_CLUSTER"
  ECS_SERVICE: "$ECS_SERVICE"
  IMAGE_TAG: $CI_COMMIT_SHA # Use the unique commit ID as the image tag

build:
  stage: build
  image: docker:latest # Use a Docker image to run the job
  script:
    - echo "Logging into ECR..."
    - apk add --no-cache aws-cli # Install AWS CLI in the container
    - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REPO
    - echo "Building Docker image..."
    - docker build -t $ECR_REPO:$IMAGE_TAG -t $ECR_REPO:latest .
    - echo "Pushing image to ECR..."
    - docker push $ECR_REPO:$IMAGE_TAG
    - docker push $ECR_REPO:latest

deploy_to_ecs:
  stage: deploy
  image: docker:latest # Use a Docker image to run the job
  script:
    - echo "Logging into ECR..."
    - apk add --no-cache aws-cli # Install AWS CLI in the container
    - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REPO
    - echo "Deploying new version to ECS..."
    - aws ecs update-service --cluster $ECS_CLUSTER_NAME --service $ECS_SERVICE_NAME --force-new-deployment --region $AWS_DEFAULT_REGION
    - echo "Deployment complete."
